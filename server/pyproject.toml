[project]
name = "tracker-server"
version = "0.1.0"
description = "Server for the Android Tracker app: ingests usage events and device metrics from multiple devices into PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.30,<0.35",
    "psycopg[binary,pool]>=3.3,<3.4",
]

[project.scripts]
tracker-server = "tracker_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/tracker_server"]

[tool.ruff]
line-length = 100
target-version = "py312"
